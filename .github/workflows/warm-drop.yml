# Opens the post office before each collection.
#
# The federation collects envelopes at 00/06/12/18 UTC. lxm-drop sleeps after
# 15 minutes idle and a full wake runs 102-248s measured (Ray 061 crossed with
# our own logs; every smaller number anyone had was truncated by their own
# ceiling), so without this every collection meets a cold instance — and a
# member's push can die outright, because the client's warm-up budget is
# smaller than a real cold start.
#
# Shape, third iteration (2026-08-27). Each rewrite was forced by the same
# discovery arriving one order of magnitude larger:
#
#   v1  cron at T-5.   GitHub ran it 15-34 min late, every time. Warming
#       landed after the anchor it was named for.
#   v2  cron at T-40, job hits at absolute times (T-5, T+10) so a late start
#       degrades instead of missing. Held for two days, then GitHub started
#       runs 2h02m and 5h12m late — the 08-27 00:00 anchor got no warming at
#       all, and Ray measured the consequence from the other side (their 045:
#       a collection at 18:02 paying >170s against a cold instance).
#   v3  this. A lead cannot outrun a delay of unknown size, so stop betting on
#       one firing: fire HOURLY, and let any run that finds an anchor within
#       reach sleep to that anchor's absolute times. Three independent runs
#       cover each anchor; all three must be delayed past it to miss.
#
# Runs with no anchor in reach exit WITHOUT touching the drop, so idling costs
# no instance time — only runner minutes, which are free on a public repo.
#
# The request carries NO token, deliberately. An unauthenticated GET still
# wakes the instance and comes back 401, and hub_drop answers that 401 before
# the rate limiter (the `_auth` ordering contract), so this costs no member's
# per-minute budget and needs no secret.
#
# Budget: only anchor-serving runs touch the instance — 4 anchors/day, up ~15
# min past T+10, so ~2h/day even with duplicate hits (a hit on an already-warm
# instance returns in ~200ms and extends nothing). Well inside the account's
# 750 shared free hours.
#
# This run history IS the liveness evidence, and it has lied to us twice by
# saying "success" while doing nothing useful. So each run now states which
# anchor it served, and annotates its own scheduling delay — the root cause
# is GitHub's queue, and that belongs on the run summary where it is visible
# without anyone grepping for it.

name: warm-drop

on:
  schedule:
    - cron: '20 * * * *'   # hourly; each run decides whether an anchor is in reach
  workflow_dispatch:        # manual wake, and how a new shape is proven

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Serve the next collection anchor
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -u
          URL="https://lxm-drop.onrender.com/v0/hub-ops/from-lxm"

          PERIOD=21600   # anchors every 6h, on the hour (crossed against the
                         # published timetable by tests/test_federation_timetable.py)
          LEAD=600       # hit at T-10. Was T-5 until 2026-09-04: envelope 056
                         # pre-committed "raise the lead the day the tail passes
                         # 300s", and Ludex's 093 delivered a 352.6s completed
                         # wake plus a truncated one >=400 — at T-5 that wake
                         # finishes AFTER the anchor it was warming for.
          TAIL=600       # and at T+10, holding the window to roughly T+25
          HORIZON=10200  # serve an anchor up to 2h50m out, so three consecutive
                         # hourly runs overlap on the same anchor

          # --- how late was GitHub? The root cause of both prior rewrites, so
          # it goes on the run summary rather than into a log nobody opens.
          if [ -n "${SCHEDULE:-}" ]; then
            slot_min="${SCHEDULE%% *}"
            now_s=$(date -u +%s)
            hour_start=$(( now_s / 3600 * 3600 ))
            slot=$(( hour_start + slot_min * 60 ))
            [ "$slot" -gt "$now_s" ] && slot=$(( slot - 3600 ))
            delay=$(( (now_s - slot) / 60 ))
            echo "scheduled :${slot_min}, started ${delay} min late"
            if [ "$delay" -gt 20 ]; then
              echo "::warning::GitHub started this run ${delay} min after its slot — \
          hourly firing is what covers this, but a delay this size means fewer \
          runs are in position for each anchor"
            fi
          fi

          now=$(date -u +%s)
          # Next anchor at or after now (not the nearest — a passed anchor is
          # not servable, and v2 wasted three hits discovering that).
          anchor=$(( (now + PERIOD - 1) / PERIOD * PERIOD ))
          until_anchor=$(( anchor - now ))

          if [ "$until_anchor" -gt "$HORIZON" ]; then
            echo "idle — next anchor $(date -u -d "@${anchor}" '+%H:%M' 2>/dev/null \
              || date -u -r "${anchor}" '+%H:%M') UTC is $(( until_anchor / 60 )) min away"
            echo "no drop contact made (idling must not cost instance time)"
            exit 0
          fi

          anchor_hhmm=$(date -u -d "@${anchor}" '+%H:%M' 2>/dev/null || date -u -r "${anchor}" '+%H:%M')
          echo "serving anchor ${anchor_hhmm} UTC"

          # 600, not 400: the ceiling must sit above the distribution it
          # measures, and the distribution keeps growing — 248 pushed 120 out,
          # then a 352.6s completion and a wake truncated at 400 (Ludex, 093)
          # pushed 400 out. The rule that survives is Ludex's: the budget is
          # not "covers the observed max" but "raised until truncation stops".
          wake() {
            curl -s -o /dev/null --max-time 600 -w '%{http_code} %{time_total}' "$URL"
          }

          # Any HTTP status means the instance answered — 401 is the expected
          # one and is a success here. Only a connection failure is a failure,
          # and a genuine connection cut gets one retry.
          hit() {
            out="$(wake)" || out=""
            code="${out%% *}"; secs="${out#* }"
            if [ -z "$code" ] || [ "$code" = "000" ]; then
              echo "no response — retrying once (connection cuts happen)"
              sleep 20
              out="$(wake)" || out=""
              code="${out%% *}"; secs="${out#* }"
            fi
            if [ -z "$code" ] || [ "$code" = "000" ]; then
              echo "::error::lxm-drop did not answer — the mailbox may be down"
              exit 1
            fi
            echo "$(date -u '+%H:%M:%S') HTTP $code in ${secs}s"
          }

          for target in $(( anchor - LEAD )) $(( anchor + TAIL )); do
            d=$(( target - $(date -u +%s) ))
            if [ "$d" -gt 0 ]; then sleep "$d"; fi
            hit
          done

          echo "anchor ${anchor_hhmm} UTC served"
